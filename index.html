<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Simple POS">
<link rel="manifest" href="manifest.json">
<title>Simple POS</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--text:#20211f;--muted:#777a73;--line:#deded8;--accent:#20211f;--good:#2e6b45;--danger:#a13b3b;--radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.app{max-width:1100px;margin:auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand h1{font-size:24px;margin:0 0 3px;font-weight:750}
.brand p{margin:0;color:var(--muted);font-size:13px}
.status{font-size:12px;padding:7px 10px;border-radius:99px;background:#e9e9e4;color:#555}
nav{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;position:sticky;top:0;background:var(--bg);z-index:10}
nav button{background:#e7e6e0;color:#555;padding:11px 14px;border-radius:12px;white-space:nowrap;font-weight:650}
nav button.active{background:var(--accent);color:white}
.page{display:none}.page.active{display:block}
.grid{display:grid;gap:12px}.two{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr)}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 2px 8px #00000008}
.card h2,.card h3{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:22px;margin-top:4px}
.categories{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.pill{background:#e9e8e2;padding:9px 13px;border-radius:99px;white-space:nowrap}.pill.active{background:var(--accent);color:#fff}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.menu{grid-template-columns:repeat(2,1fr)}}
.menu button{min-height:76px;text-align:left;background:#fafaf8;border:1px solid var(--line);border-radius:14px;padding:13px}
.menu button strong{display:block;font-size:16px}.menu button span{display:block;margin-top:7px;color:var(--muted)}
.cart-row,.order-row,.menu-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-row:last-child,.order-row:last-child,.menu-row:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:8px}.qty button,.iconbtn{width:34px;height:34px;border-radius:10px;background:#e9e8e2}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:750;padding-top:14px}
.primary{width:100%;background:var(--accent);color:#fff;padding:14px;border-radius:13px;font-weight:700;margin-top:10px}
.secondary{background:#e9e8e2;padding:11px 13px;border-radius:11px;font-weight:650}
.danger{background:#f5dfdf;color:var(--danger);padding:10px 12px;border-radius:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;color:var(--muted);font-weight:650}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px}
.table-wrap{overflow:auto}
.badge{display:inline-block;padding:5px 8px;border-radius:8px;background:#ecebe6;font-size:12px}
.notice{padding:12px;border-radius:12px;background:#f0efe9;margin-bottom:12px}
.empty{text-align:center;padding:28px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}
.sheet{background:var(--card);width:min(600px,100%);border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay-grid button{padding:18px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:700}.pay-grid button.selected{border-color:var(--accent);background:#eee}
.print-only{display:none}
@media print{
 body{background:#fff}.app{max-width:none;padding:0}.no-print,nav,header{display:none!important}
 .page{display:none!important}.page.active{display:block!important}.print-only{display:block}
 .card,.stat{box-shadow:none;border:0;padding:0}.table-wrap{overflow:visible}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><h1 id="businessTitle">Simple POS</h1><p id="pageSubtitle">Simple sales & payments</p></div>
  <div id="onlineStatus" class="status">Offline ready</div>
</header>

<nav class="no-print">
<button data-page="sale">Sale</button><button data-page="orders">Orders</button><button data-page="daily">Daily Log</button><button data-page="reports">Reports</button><button data-page="menu">Menu</button><button data-page="settings">Settings</button>
</nav>

<section id="sale" class="page">
<div class="grid two">
<div class="card">
<h2>New sale</h2>
<div id="saleCategories" class="categories"></div>
<div id="saleMenu" class="menu"></div>
</div>
<div class="card">
<h2>Current order</h2>
<div id="cart"></div>
<div class="total"><span>Total</span><span id="cartTotal">$0.00</span></div>
<div class="actions no-print">
<button id="clearCart" class="secondary">Clear</button>
<button id="saveOrder" class="secondary">Save order</button>
<button id="payNow" class="primary" style="margin-top:0;flex:1">Take payment</button>
</div>
</div>
</div>
</section>

<section id="orders" class="page">
<div class="card"><h2>Open orders</h2><div id="openOrders"></div></div>
</section>

<section id="daily" class="page">
<div class="card no-print">
<div class="actions" style="align-items:end">
<div class="field" style="margin:0;flex:1"><label>Date</label><input type="date" id="dailyDate"></div>
<button class="secondary" id="todayBtn">Today</button><button class="secondary" id="printDaily">Print / Share</button>
</div>
</div>
<div id="dailyReport"></div>
</section>

<section id="reports" class="page">
<div class="card no-print">
<div class="actions" style="align-items:end">
<div class="field" style="margin:0;flex:1"><label>Report period</label>
<select id="reportRange"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last 365 days</option></select></div>
</div>
</div>
<div id="reportsContent"></div>
</section>

<section id="menu" class="page">
<div class="grid two">
<div class="card"><h2>Menu items</h2><div id="menuList"></div></div>
<div class="card"><h2 id="menuFormTitle">Add menu item</h2>
<div class="field"><label>Item name</label><input id="itemName" placeholder="e.g. Cheeseburger"></div>
<div class="field"><label>Price ($)</label><input id="itemPrice" type="number" min="0" step="0.01" placeholder="12.00"></div>
<div class="field"><label>Category</label><input id="itemCategory" placeholder="e.g. Mains"></div>
<div class="actions"><button id="saveItem" class="primary" style="flex:1">Add item</button><button id="cancelEdit" class="secondary" style="display:none">Cancel</button></div>
</div></div>
</section>

<section id="settings" class="page">
<div class="card">
<h2>Settings & backup</h2>
<div class="field"><label>Business name</label><input id="businessName"></div>
<button id="saveBusiness" class="primary">Save business name</button>
<hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
<h3>Backup</h3><p class="small muted">Sales are stored on this iPad. Export a backup regularly so your records are safe if the browser data is lost.</p>
<div class="actions"><button id="exportData" class="secondary">Export backup</button><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer">Import backup<input id="importData" type="file" accept=".json" style="display:none"></label></div>
<hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
<h3>Data</h3><button id="clearSales" class="danger">Delete all sales & open orders</button>
</div>
</section>
</div>

<div id="paymentModal" class="modal">
<div class="sheet">
<div class="actions" style="justify-content:space-between"><h2 style="margin:0">Take payment</h2><button id="closePay" class="iconbtn">×</button></div>
<p id="payTotal" style="font-size:22px;font-weight:750"></p>
<div class="pay-grid">
<button data-method="EFTPOS">EFTPOS</button><button data-method="Cash">Cash</button><button data-method="Bank transfer">Bank transfer</button><button data-method="Other">Other</button>
</div>
<button id="recordPayment" class="primary" disabled>Record payment</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const KEY="simple-pos-v2";
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>new Intl.NumberFormat("en-NZ",{style:"currency",currency:"NZD"}).format(Number(n)||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const defaultData=()=>({businessName:"My Business",menu:[
{id:"1",name:"Example Burger",price:10,category:"Mains",active:true},
{id:"2",name:"Example Drink",price:5,category:"Drinks",active:true}
],orders:[],openOrders:[],nextOrder:1});
let data=load(),cart=[],category="All",editingId=null,paymentMethod=null,currentPage="sale";

function load(){try{return JSON.parse(localStorage.getItem(KEY))||defaultData()}catch(e){return defaultData()}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function setPage(p){currentPage=p;document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id===p));document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));renderAll()}
function renderAll(){ $("businessTitle").textContent=data.businessName||"Simple POS"; if(currentPage==="sale")renderSale(); if(currentPage==="orders")renderOpen(); if(currentPage==="daily")renderDaily(); if(currentPage==="reports")renderReports(); if(currentPage==="menu")renderMenu(); if(currentPage==="settings")renderSettings() }

function renderSale(){
 const cats=["All",...new Set(data.menu.filter(i=>i.active).map(i=>i.category).filter(Boolean))];
 $("saleCategories").innerHTML=cats.map(c=>`<button class="pill ${c===category?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
 $("saleCategories").querySelectorAll("button").forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderSale()});
 const items=data.menu.filter(i=>i.active&&(category==="All"||i.category===category));
 $("saleMenu").innerHTML=items.length?items.map(i=>`<button onclick="addItem('${i.id}')"><strong>${esc(i.name)}</strong><span>${money(i.price)}</span></button>`).join(""):`<div class="empty">No menu items in this category.</div>`;
 $("cart").innerHTML=cart.length?cart.map((i,n)=>`<div class="cart-row"><div><strong>${esc(i.name)}</strong><div class="small muted">${money(i.price)} each</div></div><div class="qty"><button onclick="changeQty(${n},-1)">−</button><b>${i.qty}</b><button onclick="changeQty(${n},1)">+</button></div></div>`).join(""):`<div class="empty">Tap an item to start the order.</div>`;
 $("cartTotal").textContent=money(cart.reduce((s,i)=>s+i.price*i.qty,0));
}
function addItem(id){let m=data.menu.find(x=>x.id===id);if(!m)return;let x=cart.find(i=>i.id===id);x?x.qty++:cart.push({id:m.id,name:m.name,price:m.price,qty:1});renderSale()}
function changeQty(n,d){cart[n].qty+=d;if(cart[n].qty<=0)cart.splice(n,1);renderSale()}
function cartTotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}
function saveOpen(){if(!cart.length)return alert("Add an item first.");data.openOrders.push({id:uid(),number:data.nextOrder++,createdAt:new Date().toISOString(),items:cart.map(x=>({...x})),total:cartTotal()});save();cart=[];renderAll();alert("Order saved.");}
function openPayment(order=null){if(!order&&!cart.length)return alert("Add an item first.");window.paymentOrder=order;paymentMethod=null;$("payTotal").textContent=money(order?order.total:cartTotal());$("recordPayment").disabled=true;$("paymentModal").classList.add("show");document.querySelectorAll(".pay-grid button").forEach(b=>b.classList.remove("selected"))}
function closePayment(){$("paymentModal").classList.remove("show")}
function recordPayment(){if(!paymentMethod)return;let o=window.paymentOrder;if(o){data.openOrders=data.openOrders.filter(x=>x.id!==o.id)}else{o={number:data.nextOrder++,createdAt:new Date().toISOString(),items:cart.map(x=>({...x})),total:cartTotal()};cart=[]}o.paidAt=new Date().toISOString();o.paymentMethod=paymentMethod;data.orders.push(o);save();closePayment();renderAll();alert(`Payment recorded: ${paymentMethod}`)}
function renderOpen(){
 const a=data.openOrders;
 $("openOrders").innerHTML=a.length?a.map(o=>`<div class="order-row"><div><strong>Order #${o.number}</strong><div class="small muted">${fmtTime(o.createdAt)} · ${itemsText(o.items)}</div></div><div style="text-align:right"><strong>${money(o.total)}</strong><div class="actions" style="justify-content:flex-end;margin-top:6px"><button class="secondary" onclick="resumeOrder('${o.id}')">Open</button><button class="secondary" onclick="openPayment(data.openOrders.find(x=>x.id==='${o.id}'))">Take payment</button><button class="danger" onclick="deleteOpen('${o.id}')">Delete</button></div></div></div>`).join(""):`<div class="empty">No open orders.</div>`;
}
function resumeOrder(id){let o=data.openOrders.find(x=>x.id===id);if(!o)return;cart=o.items.map(x=>({...x}));data.openOrders=data.openOrders.filter(x=>x.id!==id);save();setPage("sale")}
function deleteOpen(id){if(confirm("Delete this open order?")){data.openOrders=data.openOrders.filter(x=>x.id!==id);save();renderOpen()}}
function ordersForDate(d){return data.orders.filter(o=>o.paidAt?.slice(0,10)===d)}
function dailyStats(orders){return {sales:orders.reduce((s,o)=>s+o.total,0),orders:orders.length,items:orders.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.qty,0),0)}}
function renderDaily(){
 const d=$("dailyDate").value||today();$("dailyDate").value=d;const os=ordersForDate(d),s=dailyStats(os);
 const methods={};const items={};os.forEach(o=>{methods[o.paymentMethod]=(methods[o.paymentMethod]||0)+o.total;o.items.forEach(i=>items[i.name]=(items[i.name]||0)+i.qty)});
 $("dailyReport").innerHTML=`<div class="card"><h2>${data.businessName||"Business"} — End of Day Report</h2><p class="muted">${formatDate(d)}</p>
 <div class="stats"><div class="stat">Sales<b>${money(s.sales)}</b></div><div class="stat">Orders<b>${s.orders}</b></div><div class="stat">Average order<b>${money(s.orders?s.sales/s.orders:0)}</b></div><div class="stat">Items sold<b>${s.items}</b></div></div>
 <h3 style="margin-top:22px">Transactions</h3>${os.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Time</th><th>Purchased</th><th>Payment</th><th>Total</th></tr></thead><tbody>${os.map(o=>`<tr><td>#${o.number}</td><td>${fmtTime(o.paidAt)}</td><td>${itemsText(o.items)}</td><td>${esc(o.paymentMethod)}</td><td>${money(o.total)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No completed transactions for this date.</div>`}
 <h3 style="margin-top:22px">Payment totals</h3>${totalsTable(methods,"Payment method")}
 <h3 style="margin-top:22px">Items sold</h3>${totalsTable(items,"Item",true)}
 <div class="print-only"><p>Generated ${new Date().toLocaleString("en-NZ")}</p></div></div>`;
}
function totalsTable(obj,label,qty=false){let keys=Object.keys(obj).sort((a,b)=>obj[b]-obj[a]);return keys.length?`<div class="table-wrap"><table><thead><tr><th>${label}</th><th>Total</th></tr></thead><tbody>${keys.map(k=>`<tr><td>${esc(k)}</td><td>${qty?obj[k]:money(obj[k])}</td></tr>`).join("")}</tbody></table></div>`:`<div class="muted small">None.</div>`}
function renderReports(){
 const days=Number($("reportRange").value),end=new Date(),start=new Date(end);start.setDate(start.getDate()-days+1);
 const os=data.orders.filter(o=>new Date(o.paidAt)>=start&&new Date(o.paidAt)<=end),s=dailyStats(os),items={},methods={},byDay={};
 os.forEach(o=>{methods[o.paymentMethod]=(methods[o.paymentMethod]||0)+o.total;o.items.forEach(i=>items[i.name]=(items[i.name]||0)+i.qty);let d=o.paidAt.slice(0,10);byDay[d]=(byDay[d]||0)+o.total});
 const top=Object.entries(items).sort((a,b)=>b[1]-a[1]).slice(0,10);
 const activeDays=Object.keys(byDay).length;
 const bestDay=Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
 $("reportsContent").innerHTML=`<div class="card"><h2>Sales overview</h2><p class="muted">Last ${days} days</p><div class="stats">
 <div class="stat">Total sales<b>${money(s.sales)}</b></div><div class="stat">Orders<b>${s.orders}</b></div><div class="stat">Average order<b>${money(s.orders?s.sales/s.orders:0)}</b></div><div class="stat">Items sold<b>${s.items}</b></div></div>
 <div class="stats" style="margin-top:10px"><div class="stat">Active sales days<b>${activeDays}</b></div><div class="stat">Avg sales / active day<b>${money(activeDays?s.sales/activeDays:0)}</b></div><div class="stat">Top item<b>${top[0]?esc(top[0][0]):"—"}</b></div><div class="stat">Best day<b>${bestDay?formatDate(bestDay[0]):"—"}</b></div></div>
 <div class="grid two" style="margin-top:18px"><div><h3>Most sold items</h3>${top.length?`<table><thead><tr><th>Item</th><th>Qty</th></tr></thead><tbody>${top.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No sales yet.</div>`}</div>
 <div><h3>Payment methods</h3>${totalsTable(methods,"Method")}</div></div>
 <h3 style="margin-top:24px">Daily performance</h3>${dailyPerformance(byDay)}</div>`;
}
function dailyPerformance(byDay){let dates=Object.keys(byDay).sort().reverse();return dates.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Orders</th><th>Sales</th><th>Average order</th></tr></thead><tbody>${dates.map(d=>{let o=ordersForDate(d),s=dailyStats(o);return`<tr><td>${formatDate(d)}</td><td>${s.orders}</td><td>${money(s.sales)}</td><td>${money(s.orders?s.sales/s.orders:0)}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty">No completed sales in this period.</div>`}
function renderMenu(){
 $("menuList").innerHTML=data.menu.length?data.menu.map(i=>`<div class="menu-row"><div><strong>${esc(i.name)}</strong><div class="small muted">${esc(i.category||"Uncategorised")} · ${money(i.price)} · ${i.active?"Visible":"Hidden"}</div></div><div class="actions"><button class="secondary" onclick="editItem('${i.id}')">Edit</button><button class="secondary" onclick="toggleItem('${i.id}')">${i.active?"Hide":"Show"}</button></div></div>`).join(""):`<div class="empty">No menu items yet.</div>`;
}
function renderSettings(){$("businessName").value=data.businessName||""}
function editItem(id){let i=data.menu.find(x=>x.id===id);if(!i)return;editingId=id;$("menuFormTitle").textContent="Edit menu item";$("itemName").value=i.name;$("itemPrice").value=i.price;$("itemCategory").value=i.category||"";$("saveItem").textContent="Save changes";$("cancelEdit").style.display="block"}
function resetForm(){editingId=null;$("menuFormTitle").textContent="Add menu item";$("itemName").value="";$("itemPrice").value="";$("itemCategory").value="";$("saveItem").textContent="Add item";$("cancelEdit").style.display="none"}
function saveItem(){let name=$("itemName").value.trim(),price=Number($("itemPrice").value),cat=$("itemCategory").value.trim()||"Other";if(!name||!(price>=0))return alert("Please enter an item name and valid price.");if(editingId){let i=data.menu.find(x=>x.id===editingId);Object.assign(i,{name,price,category:cat})}else data.menu.push({id:uid(),name,price,category:cat,active:true});save();resetForm();renderMenu();alert("Menu item saved.")}
function toggleItem(id){let i=data.menu.find(x=>x.id===id);if(i){i.active=!i.active;save();renderMenu()}}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`pos-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importDataFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.menu||!x.orders||!x.openOrders)throw Error();data=x;save();cart=[];renderAll();alert("Backup imported.")}catch(err){alert("That backup file could not be imported.")}};r.readAsText(f);e.target.value=""}
function clearSales(){if(confirm("This will permanently delete all completed and open sales from this iPad. Continue?")){data.orders=[];data.openOrders=[];save();renderAll()}}
function fmtTime(x){return new Date(x).toLocaleTimeString("en-NZ",{hour:"2-digit",minute:"2-digit"})}
function formatDate(x){return new Date(x+"T00:00:00").toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function itemsText(items){return items.map(i=>`${i.qty}× ${i.name}`).join(", ")}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setPage(b.dataset.page));
$("clearCart").onclick=()=>{cart=[];renderSale()};
$("saveOrder").onclick=saveOpen;
$("payNow").onclick=()=>openPayment();
$("closePay").onclick=closePayment;
document.querySelectorAll(".pay-grid button").forEach(b=>b.onclick=()=>{paymentMethod=b.dataset.method;document.querySelectorAll(".pay-grid button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("recordPayment").disabled=false});
$("recordPayment").onclick=recordPayment;
$("dailyDate").onchange=renderDaily;
$("todayBtn").onclick=()=>{$("dailyDate").value=today();renderDaily()};
$("printDaily").onclick=()=>window.print();
$("reportRange").onchange=renderReports;
$("saveItem").onclick=saveItem;
